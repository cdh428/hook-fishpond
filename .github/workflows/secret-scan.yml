name: secret-scan

# 第 4 层兜底闸门：抓「本机没装 pre-commit 钩子」「用了 --no-verify」「别人直接推」
# 这类绕过本地闸门的提交。
#
# 与 ci.yml 里的「密文扫描」互补：
#   ci.yml        → scripts/check-secrets.sh，认本项目特有形态（authToken、中文口令）
#   本 workflow   → gitleaks，150+ 服务商规则 + 熵检测（认无前缀的随机串）
# 两层都在，才覆盖得了「已知格式」和「未知格式」两种泄漏。
#
# ⚠️ 装完要去 GitHub 仓库设置里打开分支保护 → Require status checks → 勾选
#    secret-scan，否则这一步失败也拦不住合并。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # 每周一 03:00 UTC 扫全历史
    # 目的：找「已经删掉、但仍留在 git 历史里」的旧泄露。当前树干净 ≠ 历史干净。
    - cron: "0 3 * * 1"

# 同一分支的新推送取消上一次
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks 全历史扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout（全历史）
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 是必须的。默认只取最后 1 个提交，
          # 历史里的泄露会完全扫不到 —— 那样这层就白装了。
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本仓库是 public，不需要 license。
          # 若将来改成 private，需在仓库 Secrets 里加 GITLEAKS_LICENSE。

# ── 三条硬规矩 ──────────────────────────────────────────────
# 1. 不许为了让 CI 变绿往 gitleaks.toml 的 allowlist 里塞源码目录。
#    白名单只放「构建产物 / 依赖 / 本机密钥目录」这类本来就不该扫的路径。
# 2. 抓到的若确实是真凭据：先轮换 → 再清理历史 → 最后才考虑白名单。
#    顺序反了等于没修（见 SECURITY.md「删 ≠ 修复」）。
# 3. 本 workflow 失败必须能阻止合并（分支保护里勾上）。
